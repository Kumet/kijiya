{% extends "base.html" %}

{% block body %}
<header class="site-header">
  <h1>url to article</h1>
  <p class="tagline">記事のURLと指示から、新しい記事を組み直す。</p>
</header>

<main>
  <form class="generate-form"
        hx-post="/api/generate"
        hx-target="#result"
        hx-swap="innerHTML"
        hx-indicator="#indicator"
        hx-disabled-elt="find button, find input, find textarea">
    <div class="field">
      <label for="url">記事URL</label>
      <input type="url" id="url" name="url" required placeholder="https://...">
    </div>

    <div class="field">
      <label for="prompt">指示</label>
      <textarea id="prompt" name="prompt" required rows="4"
        placeholder="例: 高校生にもわかるように、専門用語を噛み砕いて解説記事にして。トーンや分量の希望もここに書いてください。"></textarea>
    </div>

    <button type="submit">記事を組む</button>
  </form>

  <div id="indicator" class="htmx-indicator" aria-live="polite">
    <div class="loading-bar"></div>
    <p>記事を組んでいます… (30秒ほどかかります)</p>
  </div>

  <div id="result">
    <p class="empty-state">URLと指示を入力して「記事を組む」を押すと、ここに結果が表示されます。</p>
  </div>
</main>
{% endblock %}
